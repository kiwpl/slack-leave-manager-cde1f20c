<script>
  // "Today" in the mockup, so the sample data stays realistic.
  const TODAY = "2026-11-11";

  const $ = (id) => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MON3 = MONTHS.map((m) => m.slice(0, 3));
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmt(s) { const d = parse(s); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
  function fmtShort(s) { const d = parse(s); return MON3[d.getMonth()] + " " + d.getDate(); }
  function fmtRange(s, e) {
    const a = parse(s), b = parse(e);
    if (s === e) return fmtShort(s) + ", " + a.getFullYear();
    if (a.getFullYear() === b.getFullYear()) return fmtShort(s) + " – " + fmtShort(e) + ", " + a.getFullYear();
    return fmtShort(s) + ", " + a.getFullYear() + " – " + fmtShort(e) + ", " + b.getFullYear();
  }
  function shortDate(s) { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear(); }
  function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
  function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate() + n); return c; }
  function eachDay(s, e, fn) { let d = parse(s); const end = parse(e); while (d <= end) { fn(d, iso(d)); d = addDays(d, 1); } }
  function num(n) { return String(Math.round(n * 100) / 100); }
  function joinAnd(list) { return list.length <= 1 ? list.join("") : list.slice(0, -1).join(", ") + " and " + list[list.length - 1]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // Ontario statutory holidays (observed dates when they fall on a weekend).
  const HOLIDAYS = {
    "2026-01-01": ["New Year's Day"], "2026-02-16": ["Family Day"], "2026-04-03": ["Good Friday"],
    "2026-05-18": ["Victoria Day"], "2026-07-01": ["Canada Day"], "2026-09-07": ["Labour Day"],
    "2026-10-12": ["Thanksgiving"], "2026-12-25": ["Christmas Day"], "2026-12-28": ["Boxing Day", true],
    "2027-01-01": ["New Year's Day"], "2027-02-15": ["Family Day"], "2027-03-26": ["Good Friday"],
    "2027-05-24": ["Victoria Day"], "2027-07-01": ["Canada Day"], "2027-09-06": ["Labour Day"],
    "2027-10-11": ["Thanksgiving"], "2027-12-27": ["Christmas Day", true], "2027-12-28": ["Boxing Day", true],
  };
  function isOff(d, useHol) { return isWeekend(d) || (useHol && !!HOLIDAYS[iso(d)]); }
  function countBusinessDays(start, end, useHol) {
    if (parse(start) > parse(end)) return 0;
    let n = 0; eachDay(start, end, (d) => { if (!isOff(d, useHol)) n++; });
    return n;
  }
  // Same as the app's calcTotal (with morning off); holidays left out only when useHol is on.
  function calcTotal(start, end, startP, endP, useHol) {
    const biz = countBusinessDays(start, end, useHol);
    if (start === end) return (startP === "pm" || endP === "am") ? 0.5 : 1;
    let total = biz;
    if (startP === "pm" && !isOff(parse(start), useHol)) total -= 0.5;
    if (endP === "am" && !isOff(parse(end), useHol)) total -= 0.5;
    return total;
  }
  function returnDate(end, useHol) { let d = addDays(parse(end), 1); while (isOff(d, useHol)) d = addDays(d, 1); return fmt(iso(d)); }
  function holidaysBetween(start, end) {
    const out = [];
    if (!start || !end || parse(start) > parse(end)) return out;
    eachDay(start, end, (d, s) => { if (HOLIDAYS[s] && !isWeekend(d)) out.push(s); });
    return out;
  }
  function holidayLabel(s) { const [name, observed] = HOLIDAYS[s]; return observed ? `${name} (observed, ${fmtShort(s)})` : `${name} (${fmtShort(s)})`; }
  function isWithin30Days(start) { return !!start && parse(start) <= addDays(parse(TODAY), 30); }

  // ---------- Sample team data ----------
  const PEOPLE = ["Alex Martin", "Chris Wong", "David Chen", "Jordan Lee", "Maria Santos", "Nadia Rahman", "Priya Shah", "Sam Patel"];
  // k: vac | sick | flex. sp "pm" = afternoon off on first day, ep "am" = morning off on last day.

    { n: "Jordan Lee", k: "vac", s: "2026-12-21", e: "2026-12-24", pending: true, sub: "2026-11-09" },
    { n: "Alex Martin", k: "sick", s: "2026-02-09", e: "2026-02-10", sub: "2026-02-10" },
    { n: "Alex Martin", k: "vac", s: "2026-10-26", e: "2026-10-30", sub: "2026-09-14" },
    { n: "Alex Martin", k: "vac", s: "2026-12-15", e: "2026-12-18", sub: "2026-10-05" },
    { n: "David Chen", k: "vac", s: "2026-09-08", e: "2026-09-11", sub: "2026-07-27" },
    { n: "David Chen", k: "vac", s: "2026-11-13", e: "2026-11-13", sp: "pm", sub: "2026-10-30" },
    { n: "Chris Wong", k: "vac", s: "2026-08-17", e: "2026-08-21", sub: "2026-06-15" },

  // Calls cb(date, amount) for each weekday of an entry inside [from, to]. Flexible time gives hours.
  function entryDays(en, from, to, cb) {
    if (en.k === "flex") { if (en.s >= from && en.s <= to) cb(en.s, en.h); return; }
    const same = en.s === en.e;
    eachDay(en.s, en.e, (d, s) => {
      if (isWeekend(d) || s < from || s > to) return;
      let amt = 1;
      if (same) amt = (en.sp === "pm" || en.ep === "am") ? 0.5 : 1;
      else { if (s === en.s && en.sp === "pm") amt -= 0.5; if (s === en.e && en.ep === "am") amt -= 0.5; }
      cb(s, amt);
    });
  }

  // Maria's own requests (same as round 1).
  const myRequests = [
    { kind: "time_off", type: "sick", start: "2026-11-04", end: "2026-11-04", startP: "full", endP: "am", status: "approved", auto: true, submitted: "2026-11-04" },

  }

  // The app's formatRequestDates (new types use the vacation wording).
  function formatRequestDates(r) {
    const startSuffix = r.startP === "pm" ? " (afternoon)" : "";
    const endSuffix = r.endP === "am" ? " (morning)" : "";
    const oneDay = r.start === r.end;
    if (r.type !== "sick") {
      if (oneDay) {
        if (r.startP === "pm") return `Afternoon off · ${r.start}`;
        if (r.endP === "am") return `Morning off · ${r.start}`;
        return r.start;
      }
      return `${r.start}${startSuffix} → ${r.end}${endSuffix}`;
    }
    if (!oneDay) return `${r.start}${startSuffix} → ${r.end}${endSuffix}`;
    if (r.startP === "pm") return `Afternoon · ${r.start}`;
    if (r.endP === "am") return `Morning · ${r.start}`;
    return r.start;
  }

  function renderList() {
    const list = $("reqList");
    if (!list) return;
    const items = showAll ? myRequests : myRequests.slice(0, 5);
    let html = items.map((r) => {
      if (r.kind === "flexible") {
        return `<div class="flex items-center justify-between gap-2 p-3 rounded-lg border border-border hover:bg-accent/50 transition-colors cursor-pointer">
          <div class="min-w-0"><div class="flex flex-wrap items-center gap-2 mb-0.5"><span class="font-medium text-sm text-foreground">${svg(P.clock, "h-3.5 w-3.5 inline mr-1 align-[-2px]")}Flexible Time</span>${badge(r.status)}</div>
          <p class="text-xs text-muted-foreground">${r.date} · ${r.st}–${r.et} (${r.hours}h)</p></div>
          <span class="text-xs text-muted-foreground shrink-0">${shortDate(r.submitted)}</span></div>`;
      }
      return `<div class="flex items-center justify-between gap-2 p-3 rounded-lg border border-border hover:bg-accent/50 transition-colors cursor-pointer">
        <div class="min-w-0"><div class="flex flex-wrap items-center gap-2 mb-0.5"><span class="font-medium text-sm text-foreground">${TYPES[r.type].label}</span>${badge(r.status, r.auto)}${r.special ? specialBadge : ""}</div>
        <p class="text-xs text-muted-foreground">${formatRequestDates(r)}</p></div>
        <span class="text-xs text-muted-foreground shrink-0">${shortDate(r.submitted)}</span></div>`;
    }).join("");
    if (myRequests.length > 5) {
      html += `<button type="button" id="showAllBtn" class="${BTN} h-9 px-3 w-full hover:bg-accent hover:text-accent-foreground">
        ${showAll ? svg(P.chevUp, "h-4 w-4 mr-1") + " Show less" : svg(P.chevDown, "h-4 w-4 mr-1") + ` Show all ${myRequests.length} requests`}</button>`;
    }
    list.innerHTML = html;
    const b = $("showAllBtn");
    if (b) b.onclick = () => { showAll = !showAll; renderList(); };
  }

  // The app's RequestSummary (holidays left out only on proposal 2).
  function summaryText(v, st) {
    const useHol = v === "holidays";
    const incomplete = "Please complete the form to see your request summary.";
    const { type, start } = st;
    const startP = st.startHalf ? "pm" : "full";
    const endP = st.endHalf ? "am" : "full";
    if (!type) return incomplete;
    const end = type === "sick" ? (st.end || start) : st.end;
    if (!start || !end) return incomplete;
    const biz = countBusinessDays(start, end, useHol);
    if (biz === 0) return incomplete;
    const sameDay = start === end;
    const total = calcTotal(start, end, startP, endP, useHol);
    const dayLabel = total === 1 ? "1 business day" : `${num(total)} business days`;
    const startNote = startP === "pm" ? " (afternoon only)" : "";
    const endNote = endP === "am" ? " (morning only)" : "";
    const back = endP === "am" ? `${fmt(end)} (afternoon)` : returnDate(end, useHol);
    if (type === "vacation") {
      if (sameDay) {
        if (startP === "pm") return `You will take the afternoon off on ${fmt(start)}.`;
        if (endP === "am") return `You will take the morning off on ${fmt(start)}.`;
        return `You will take 1 full day off on ${fmt(start)}.`;
      }
      return `You will take vacation from ${fmt(start)}${startNote} to ${fmt(end)}${endNote} (${dayLabel}). You return on ${back}.`;
    }
    if (type === "sick") {
      if (sameDay) {
        if (startP === "pm") return `You were sick in the afternoon on ${fmt(start)}.`;
        if (endP === "am") return `You were sick in the morning on ${fmt(start)}.`;
        return `You were sick on ${fmt(start)}.`;
      }
      return `You were sick from ${fmt(start)}${startNote} to ${fmt(end)}${endNote} (${dayLabel}).`;
    }
    const T = TYPES[type];
    if (sameDay) {
      if (startP === "pm") return `You will take the afternoon off on ${fmt(start)} (${T.label}).`;
      if (endP === "am") return `You will take the morning off on ${fmt(start)} (${T.label}).`;
      return `You will take ${T.one} on ${fmt(start)}.`;
    }
    return `You will take ${T.many} from ${fmt(start)}${startNote} to ${fmt(end)}${endNote} (${dayLabel}). You return on ${back}.`;
  }

  function renderForm(v) {
    const st = forms[v];
    const btn = $("toggleForm");
    const base = `${BTN} h-9 px-3 `;
    if (st.showForm) { btn.className = base + "border border-input bg-background hover:bg-accent hover:text-accent-foreground"; btn.textContent = "Cancel"; }
    else { btn.className = base + "bg-primary text-primary-foreground hover:bg-primary/90"; btn.innerHTML = svg(P.plus, "h-4 w-4 mr-1") + " New Request"; }
    $("formArea").hidden = !st.showForm;
    $("typeFields").hidden = !st.type;
    $("reqType").value = st.type;
    $("startDate").value = st.start;
    $("endDate").value = st.end;
    $("startDate").max = st.type === "sick" ? TODAY : "";
    $("endDate").max = st.type === "sick" ? TODAY : "";
    $("endDate").min = st.start || "";
    $("startHalfDay").checked = st.startHalf;
    $("endHalfDay").checked = st.endHalf;
    $("note").value = st.note;
    $("policyAck").checked = st.ack;
    const T = TYPES[st.type];
    const needsReason = !!(T && T.approval);
    $("noteLabel").textContent = needsReason ? "Reason" : "Note (optional)";
    $("note").placeholder = needsReason ? "Please provide a reason for your request..." : "Any details...";
    $("summary").textContent = summaryText(v, st);

    const startP = st.startHalf ? "pm" : "full";
    const endP = st.endHalf ? "am" : "full";
    const useHol = v === "holidays";
    const validRange = st.start && st.end && st.start <= st.end;
    $("alert10").hidden = !(st.type === "vacation" && validRange && calcTotal(st.start, st.end, startP, endP, useHol) > 10);
    $("alert30").hidden = !(st.type === "vacation" && isWithin30Days(st.start));

    if (v === "types") {
      const info = $("typeInfo");
      info.textContent = T && T.info ? T.info : "";
      info.hidden = !(T && T.info);
    }
    if (v === "holidays") {
      const note = $("holNote");
      const ok = st.type && st.type !== "sick" && validRange;
      const hols = ok ? holidaysBetween(st.start, st.end) : [];
      // Holidays between the last day off and the return date.
      let skipped = [];
      if (ok && !st.endHalf) {
        let d = addDays(parse(st.end), 1);
        while (isOff(d, true)) { if (HOLIDAYS[iso(d)]) skipped.push(iso(d)); d = addDays(d, 1); }
      }
      const parts = [];
      if (hols.length) parts.push(`Not counted as days off: ${joinAnd(hols.map(holidayLabel))}.`);
      if (skipped.length) parts.push(`Your return date skips ${joinAnd(skipped.map(holidayLabel))}.`);
      note.textContent = parts.join(" ");
      note.hidden = !parts.length;
    }
    if (v === "days-left") {
      const el = $("afterLine");
      if (st.type === "vacation" && validRange) {
        const total = calcTotal(st.start, st.end, startP, endP, false);
        const b = balance();
        const after = b.left - total;
        el.innerHTML = after >= 0
          ? `<p class="text-sm text-muted-foreground">After this request you will have <strong class="text-foreground">${num(after)} ${after === 1 ? "day" : "days"}</strong> of vacation left this year.</p>`
          : warnAlert("", `This request is ${num(total)} ${total === 1 ? "day" : "days"}, but you have ${num(Math.max(0, b.left))} ${b.left === 1 ? "day" : "days"} of vacation left this year. Talk to your manager before you submit.`, false);
        el.hidden = false;
      } else { el.innerHTML = ""; el.hidden = true; }
    }
    if (v === "limits") {
      const el = $("limitAlerts");
      const iss = limitIssues(st);
      if (iss) {
        const lines = [];
        iss.blocked.forEach((b) => lines.push(`<strong>${fmtRange(b.s, b.e)} is blocked:</strong> ${esc(b.reason)}.`));
        if (iss.fullDays.length) lines.push(`${iss.most} ${iss.most === 1 ? "person is" : "people are"} already off on ${joinAnd(iss.fullDays.map(fmtShort))}. The team limit is ${limits.max} off at once.`);
        const tail = limits.mode === "warn" ? "You can still submit, but your manager may decline it." : "Pick other dates to submit.";
        const html = lines.map((l) => `<p>${l}</p>`).join("") + `<p class="mt-1">${tail}</p>`;
        el.innerHTML = limits.mode === "warn" ? warnAlert("", html, false) : errorAlert(html);
        el.hidden = false;
      } else { el.innerHTML = ""; el.hidden = true; }
    }
  }

  function setErr(id, msg) { const el = $(id); el.textContent = msg || ""; el.hidden = !msg; }
  function clearErrs() { ["errType", "errStart", "errEnd", "errNote", "errPolicy"].forEach((id) => setErr(id, "")); }

  function validate(v) {
    clearErrs();
    let ok = true;
    const s = forms[v];
    const T = TYPES[s.type];
    if (!s.type) { setErr("errType", "Please select a request type."); ok = false; }
    if (!s.start) { setErr("errStart", "Start date is required."); ok = false; }
    if (s.type && s.type !== "sick") {
      if (!s.end) { setErr("errEnd", "End date is required."); ok = false; }
      if (s.start && s.end && s.start > s.end) { setErr("errEnd", "End date must be on or after start date."); ok = false; }
    }
    if (T && T.approval && !s.note.trim()) { setErr("errNote", `Please provide a reason for your ${T.label.toLowerCase()} request.`); ok = false; }
    if (s.type === "sick") {
      if (s.start && s.start > TODAY) { setErr("errStart", "Future sick days cannot be submitted. Please submit a vacation request or contact your manager."); ok = false; }
      const effEnd = s.end || s.start;
      if (effEnd && effEnd > TODAY) { setErr("errEnd", "Sick day end date cannot be in the future."); ok = false; }
    }
    if (v === "limits" && limits.mode === "block" && limitIssues(s)) { setErr("errEnd", "These dates are blocked or the team is full. Pick other dates."); ok = false; }
    if (!s.ack) { setErr("errPolicy", "You must acknowledge the policy before submitting."); ok = false; }
    return ok;
  }

  function resetForm(v) {
    Object.assign(forms[v], { type: "", start: "", end: "", startHalf: false, endHalf: false, note: "", ack: false, showForm: false });
    clearErrs();
  }
  // On a one-day request, a day can't be both morning off and afternoon off.
  function keepOneHalf(v, changed) {
    const st = forms[v];
    if (st.start && st.start === st.end && st.startHalf && st.endHalf) {
      if (changed === "start") st.endHalf = false; else st.startHalf = false;
    }
  }

  function wireForm(v) {
    const st = forms[v];
    $("toggleForm").onclick = () => { if (st.showForm) resetForm(v); else st.showForm = true; renderForm(v); };
    $("reqType").onchange = (e) => { st.type = e.target.value; renderForm(v); };
    $("startDate").onchange = (e) => { st.start = e.target.value; if (!st.end || st.end < st.start) st.end = st.start; keepOneHalf(v, "end"); renderForm(v); };
    $("endDate").onchange = (e) => { st.end = e.target.value; keepOneHalf(v, "end"); renderForm(v); };
    $("startHalfDay").onchange = (e) => { st.startHalf = e.target.checked; keepOneHalf(v, "start"); renderForm(v); };
    $("endHalfDay").onchange = (e) => { st.endHalf = e.target.checked; keepOneHalf(v, "end"); renderForm(v); };
    $("note").oninput = (e) => { st.note = e.target.value; };
    $("policyAck").onchange = (e) => { st.ack = e.target.checked; };
    $("reqForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!validate(v)) return;
      const T = TYPES[st.type];
      const auto = !T.approval;
      myRequests.unshift({
        kind: "time_off", type: st.type, start: st.start, end: st.end || st.start,
        startP: st.startHalf ? "pm" : "full", endP: st.endHalf ? "am" : "full",
        status: auto ? "approved" : "pending_approval", auto,
        special: st.type === "vacation" && isWithin30Days(st.start), submitted: TODAY,
      });
      if (st.type === "sick") toast("Sick day recorded and auto-approved.");
      else if (st.type === "vacation") toast("Vacation request submitted for approval.");
      else toast(auto ? `${T.label} recorded and auto-approved.` : `${T.label} request submitted for approval.`);
      resetForm(v);
      renderForm(v);
      renderList();
      const bc = $("balanceCard");
      if (bc) bc.innerHTML = balanceCardInner();
    });
    renderForm(v);
    renderList();
  }

  // ---------- Proposal 1: request page (manager) ----------
  const req1 = { status: "pending_approval", decidedAt: "" };
  const JORDAN = ENTRIES.find((en) => en.n === "Jordan Lee" && en.s === "2026-12-21");

  function whoElse(req) {
    const others = ENTRIES.filter((en) => en.k === "vac" && en !== req && en.s <= req.e && en.e >= req.s);
    const days = [];
    eachDay(req.s, req.e, (d, s) => {
      if (isWeekend(d)) return;
      const off = [req, ...others].filter((en) => en.s <= s && en.e >= s);
      days.push({ s, d, off });
    });
    const most = Math.max(...days.map((x) => x.off.length));
    const busiest = days.filter((x) => x.off.length === most).map((x) => fmtShort(x.s));
    return { others, days, most, busiest };
  }
  function avatar(en, thisReq) {
    const pending = en === thisReq ? req1.status === "pending_approval" : !!en.pending;
    const cls = pending ? "bg-warning/15 text-warning" : "bg-primary/10 text-primary";
    return `<span class="h-6 w-6 rounded-full ${cls} ring-2 ring-card inline-flex items-center justify-center text-[10px] font-semibold" title="${en.n}">${initials(en.n)}</span>`;
  }

        <p class="text-sm font-medium text-foreground">${fmtShort(x.s)}</p>
        <div class="flex justify-center -space-x-1 mt-2">${x.off.map((en) => avatar(en, JORDAN)).join("")}</div>
        <p class="text-xs text-muted-foreground mt-1 tabular-nums">${x.off.length} off</p>
      </div>`).join("");
    const rows = w.others.map((en) => `
      <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-lg border border-border">

        </div>
        ${badge(en.pending ? "pending_approval" : "approved")}
      </div>`).join("");
    const timeline = [
      { title: "Submitted", when: "11/9/2026, 3:42:10 PM", by: "staff" },

    return `

        <div class="flex-1 min-w-0">
          <h1 class="text-2xl font-bold text-foreground capitalize">Vacation Request</h1>
          <p class="text-sm text-muted-foreground">Jordan Lee</p>
        </div>
        ${badge(req1.status)}
      </div>

      <div class="${CARD}">
        ${cardHead(svg(P.calendar) + "Request Details", "", "flex items-center gap-2")}
        <div class="p-6 pt-0 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><p class="text-xs text-muted-foreground uppercase tracking-wider">Type</p><p class="font-medium capitalize text-foreground">vacation</p></div>
            <div><p class="text-xs text-muted-foreground uppercase tracking-wider">Dates</p><p class="font-medium text-foreground">2026-12-21 → 2026-12-24</p></div>
            <div><p class="text-xs text-muted-foreground uppercase tracking-wider">Submitted</p><p class="font-medium text-foreground">11/9/2026, 3:42:10 PM</p></div>
            <div class="col-span-2"><p class="text-xs text-muted-foreground uppercase tracking-wider">Note</p><p class="text-foreground">Visiting family in Vancouver</p></div>
          </div>
        </div>
      </div>

      <div class="${CARD}" data-changed>
        ${cardHead(svg(P.users) + "Who else is off", "Approved and pending vacation from Dec 21 to Dec 24", "flex items-center gap-2")}
        <div class="p-6 pt-0 space-y-4">
          <div class="grid grid-cols-4 gap-2">${dayCells}</div>

            <span class="inline-flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-primary/60"></span>Approved</span>

      ${pending ? `
      <div class="${CARD} border-primary/30">

          <div class="flex flex-wrap gap-3">

        </div></div>
      </div>
    </div>`;

  const exp = { period: "this", from: "", to: "", vac: true, sick: true, flex: true, approvedOnly: true };
  function payPeriod(offset) {
    const anchor = parse(adminState.anchor || "2025-01-06");
    const days = Math.round((parse(TODAY) - anchor) / 86400000);
    const s = addDays(anchor, (Math.floor(days / 14) + offset) * 14);
    return [iso(s), iso(addDays(s, 13))];
  }
  function expRange() {
    if (exp.period === "this") return payPeriod(0);
    if (exp.period === "last") return payPeriod(-1);
    if (exp.period === "month") return ["2026-11-01", "2026-11-30"];
    if (exp.period === "year") return ["2026-01-01", "2026-12-31"];
    return [exp.from, exp.to];
  }
  function expTable() {
    const [from, to] = expRange();
    if (!from || !to || from > to) return { err: "Pick a start date on or before the end date." };
    const rows = PEOPLE.map((name) => ({ name, vac: 0, sick: 0, flex: 0 }));
    for (const en of ENTRIES) {
      if (exp.approvedOnly && en.pending) continue;
      const row = rows.find((r) => r.name === en.n);
      entryDays(en, from, to, (s, a) => { row[en.k] += a; });
    }
    const cols = [["vac", "Vacation days"], ["sick", "Sick days"], ["flex", "Flexible hours"]].filter(([k]) => exp[k]);
    const total = (k) => rows.reduce((t, r) => t + r[k], 0);
    const th = "px-3 py-2 font-medium text-muted-foreground whitespace-nowrap";
    const html = `
      <table class="w-full text-sm tabular-nums">
        <thead class="border-b border-border"><tr><th class="${th} text-left">Name</th>${cols.map(([, l]) => `<th class="${th} text-right">${l}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr class="border-b border-border"><td class="px-3 py-2 whitespace-nowrap text-foreground">${r.name}</td>${cols.map(([k]) => `<td class="px-3 py-2 text-right ${r[k] ? "text-foreground" : "text-muted-foreground"}">${num(r[k])}</td>`).join("")}</tr>`).join("")}</tbody>
        <tfoot><tr><td class="px-3 py-2 font-semibold text-foreground">Total</td>${cols.map(([k]) => `<td class="px-3 py-2 text-right font-semibold text-foreground">${num(total(k))}</td>`).join("")}</tr></tfoot>
      </table>`;
    return { html, file: `time-off-${from}-to-${to}.csv`, cols: cols.length };
  }

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
          <button id="expCancel" type="button" class="${BTN_GHOST}">Cancel</button>
          <button id="expDownload" type="button" class="${BTN_PRIMARY}">${svg(P.download)}Download CSV</button>
        </div>
        <button id="expClose" type="button" class="absolute right-4 top-4 rounded-sm opacity-70 hover:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="Close">${svg(P.x)}</button>
      </div>`;
    const refresh = () => {
      const t = expTable();
      $("expCustom").hidden = exp.period !== "custom";
      const ok = !t.err && t.cols > 0;
      $("expPreview").innerHTML = t.err
        ? `<p class="text-sm text-destructive">${t.err}</p>`
        : t.cols === 0 ? `<p class="text-sm text-destructive">Tick at least one type to include.</p>`
        : `<div class="rounded-md border border-border overflow-x-auto">${t.html}</div><p class="text-xs text-muted-foreground mt-2 break-all">${t.file}</p>`;
      $("expDownload").disabled = !ok;
      $("expDownload").dataset.file = ok ? t.file : "";
    };
    const close = () => { $("dialogRoot").innerHTML = ""; document.removeEventListener("keydown", onKey); const b = $("exportBtn"); if (b) b.focus(); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("dlgOverlay").onclick = close;
    $("expClose").onclick = close;
    $("expCancel").onclick = close;
    $("expPeriod").onchange = (e) => { exp.period = e.target.value; refresh(); };
    $("expFrom").onchange = (e) => { exp.from = e.target.value; refresh(); };
    $("expTo").onchange = (e) => { exp.to = e.target.value; refresh(); };
    [["expVac", "vac"], ["expSick", "sick"], ["expFlex", "flex"], ["expApproved", "approvedOnly"]].forEach(([id, key]) => { $(id).onchange = (e) => { exp[key] = e.target.checked; refresh(); }; });
    $("expDownload").onclick = () => { const f = $("expDownload").dataset.file; close(); toast(`Downloaded ${f}`); };
    refresh();
    $("expPeriod").focus();
  }
  function wireManager() {
    $("statusFilter").onchange = (e) => { mgrFilter = e.target.value; render(false); };
    $("exportBtn").onclick = openExport;
  }

  // ---------- Proposals and screens ----------
  const PROPOSALS = [
    { id: "who-is-off", name: "Who else is off", line: "Managers see who else is off on those dates, on the request page and in the Slack approval message.",
      screens: [
        { id: "request", label: "Request page", hint: "Try it: approve or reject. The “Who else is off” card is new." },
        { id: "slack-approval", label: "Slack approval message", hint: "Try it: tap Approve. The “Also off those days” part is new." },
      ] },
    { id: "holidays", name: "Stat holidays", line: "Ontario stat holidays aren't counted as vacation days, and the return date skips them.",
      screens: [{ id: "form-holidays", label: "New Request form", hint: "Try it: change the dates. Today the app counts Dec 21 – Jan 4 as 11 days and asks for special approval. With holidays left out it's 8." }] },
    { id: "days-left", name: "Days left", line: "Each person sees how many vacation days they have used, booked and left this year.",
      screens: [{ id: "days-left", label: "Time Off page", hint: "Try it: change the dates or submit. Sample allowance: 15 vacation days a year." }] },
    { id: "slack-post", name: "Daily Slack post", line: "Every weekday morning, Slack gets an “Out today” post listing who's away.",
      screens: [
        { id: "slack-channel", label: "Slack channel", hint: "Sample posts for Tuesday and today, Wednesday, November 11." },
        { id: "admin-post", label: "Admin Settings", hint: "Try it: change the time or channel, or switch it off, then open the Slack channel screen." },
      ] },
    { id: "team-limits", name: "Team limits", line: "Admins block busy dates and set the most people off at once. The request form warns before submit.",
      screens: [
        { id: "form-limits", label: "New Request form", hint: "Try it: change the dates. Dec 14 – 18 is blocked, and 2 people are already off on Dec 16 and 17." },
        { id: "admin-limits", label: "Admin Settings", hint: "Try it: add or remove blocked dates, change the limit or the rule, then open the New Request form." },
      ] },
    { id: "payroll-export", name: "Payroll export", line: "Managers download a CSV of days used per person for any pay period.",
      screens: [{ id: "export", label: "Manager View", hint: "Try it: tap Export CSV and switch the period." }] },
    { id: "leave-types", name: "More leave types", line: "New request types: Personal Day, Bereavement, Family Responsibility, Unpaid Leave and Jury Duty.",
      screens: [{ id: "form-types", label: "New Request form", hint: "Try it: open the Type list. The rules shown are samples you'd set yourself." }] },
  ];
  const SCREENS = {
    "request": { html: () => shell(ADMIN, "manager", requestPage()), wire: wireRequest },
    "slack-approval": { html: slackApproval, wire: wireSlackApproval },
    "form-holidays": { html: () => shell(STAFF, "timeoff", timeOffPage("holidays")), wire: () => wireForm("holidays") },
    "days-left": { html: () => shell(STAFF, "timeoff", timeOffPage("days-left")), wire: () => wireForm("days-left") },
    "slack-channel": { html: slackChannel },
    "admin-post": { html: () => shell(ADMIN, "settings", adminPage("post"), { adminBg: true }), wire: () => wireAdmin("post") },
    "form-limits": { html: () => shell(STAFF, "timeoff", timeOffPage("limits")), wire: () => wireForm("limits") },
    "admin-limits": { html: () => shell(ADMIN, "settings", adminPage("limits"), { adminBg: true }), wire: () => wireAdmin("limits") },
    "export": { html: () => shell(ADMIN, "manager", managerPage()), wire: wireManager },
    "form-types": { html: () => shell(STAFF, "timeoff", timeOffPage("types")), wire: () => wireForm("types") },
  };
  const screenIdx = {};
  function fromHash() { const h = (location.hash || "").slice(1); return PROPOSALS.some((p) => p.id === h) ? h : PROPOSALS[0].id; }
  let current = fromHash();

  function renderStrip() {
    $("propList").innerHTML = PROPOSALS.map((p, i) => {
      const on = p.id === current;
      return `<button type="button" data-prop="${p.id}" ${on ? 'aria-current="true"' : ""} class="flex items-start gap-2 w-full text-left rounded-md px-2 py-1.5 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${on ? "bg-accent" : "hover:bg-accent/60"}">
        <span class="mt-0.5 h-5 w-5 shrink-0 rounded-full text-xs font-semibold inline-flex items-center justify-center ${on ? "bg-primary text-primary-foreground" : "bg-muted text-muted-foreground"}">${i + 1}</span>
        <span class="min-w-0"><span class="font-medium text-foreground">${p.name}</span><span class="text-muted-foreground"> · ${p.line}</span></span>
      </button>`;
    }).join("");
    document.querySelectorAll("[data-prop]").forEach((b) => { b.onclick = () => go(b.dataset.prop); });
    const p = PROPOSALS.find((x) => x.id === current);
    const idx = screenIdx[p.id] || 0;
    $("screenRow").innerHTML = p.screens.length > 1
      ? `<span class="text-muted-foreground">Screen:</span><div class="inline-flex flex-wrap items-center rounded-md bg-muted p-1 text-muted-foreground gap-1">${p.screens.map((s, i) => `<button type="button" data-screen="${i}" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${i === idx ? "bg-background text-foreground shadow-sm" : "hover:text-foreground"}" aria-pressed="${i === idx}">${s.label}</button>`).join("")}</div>`
      : `<span class="text-muted-foreground">Screen:</span><span class="font-medium text-foreground">${p.screens[0].label}</span>`;
    document.querySelectorAll("[data-screen]").forEach((b) => { b.onclick = () => { screenIdx[p.id] = Number(b.dataset.screen); render(true); }; });
    $("tryHint").textContent = p.screens[idx].hint;
  }

  function render(scroll) {
    renderStrip();
    $("dialogRoot").innerHTML = "";
    const p = PROPOSALS.find((x) => x.id === current);
    const scr = p.screens[screenIdx[p.id] || 0];
    const s = SCREENS[scr.id];
    $("app").innerHTML = s.html();
    if (s.wire) s.wire();
    if (scroll) {
      const el = $("app").querySelector("[data-changed]:not([hidden])");
      if (el) el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" });
    }
  }
  function go(id) {
    if (id !== current) { current = id; render(true); }
    else render(true);
    try { if (location.hash.slice(1) !== id) location.hash = id; } catch (e) { /* hash not available */ }
  }
  window.addEventListener("hashchange", () => { const h = fromHash(); if (h !== current) { current = h; render(true); } });

  let toastTimer;
  function toast(msg) {
    $("toastText").textContent = msg;
    $("toast").classList.remove("hide");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.add("hide"), 3500);
  }

  $("outlineToggle").onclick = () => {
    const on = $("outlineToggle").getAttribute("aria-checked") !== "true";
    $("outlineToggle").setAttribute("aria-checked", String(on));
    document.body.classList.toggle("show-changes", on);
  };
  document.body.classList.add("show-changes");

  render(false);
</script>
